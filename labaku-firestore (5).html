.lg{background:var(--logo) center/contain no-repeat;aspect-ratio:320/267;width:92px;margin-bottom:10px}.lgx{width:150px;margin:0 auto 14px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:none;border-radius:8px;font-weight:500;color:var(--mu);text-align:left;margin-bottom:2px}
.nv b svg,.bot b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.nv b{font-size:16px;width:20px;text-align:center}.nv.on{background:var(--p);color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:28px 32px 40px;max-width:1440px}
h1{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}.hd p{color:var(--mu)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:16px}
.card:hover{box-shadow:0 4px 16px -2px rgba(46,90,54,.05)}
h3{font-size:16px;font-weight:600;margin-bottom:12px}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.gc{grid-template-columns:1fr 340px;align-items:start}
.lb{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mu)}
.cur{font-size:28px;line-height:38px;font-weight:700;letter-spacing:-.02em;margin-top:6px}.cur small{font-size:12px;font-weight:600;color:var(--s);margin-right:4px;letter-spacing:.02em}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:40px;transition:.15s}
.btn:hover{background:#25482B}.btn:active{transform:scale(.98)}
.btn.sc{background:var(--bg);color:var(--p);border:1px solid var(--ln)}.btn.sc:hover{background:#fff;border-color:var(--p)}
.btn.dg{background:var(--t)}.btn.sm{padding:6px 12px;min-height:32px;font-size:12px}
input,select{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(46,90,54,.12)}
input[type=number]{text-align:right}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:12px}label input,label select{margin-top:4px;font-weight:400}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(46,90,54,.08);border:1px solid rgba(46,90,54,.2);color:var(--p)}

.ft{border:1px solid var(--ln);background:#fff;color:var(--mu);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;margin:0 6px 8px 0}.ft.on{background:var(--p);border-color:var(--p);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);min-height:52px}.row:last-child{border:0}
.row small{color:var(--mu);display:block;font-size:12px}.r{text-align:right}.gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile{border:1px solid var(--ln);border-radius:16px;padding:14px;background:#fff;text-align:left;min-height:72px}.tile:hover{border-color:var(--p)}
.tile.x{opacity:.45}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.up{color:var(--p)}.dn{color:var(--t)}

.mb{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 12px 32px -4px rgba(46,90,54,.08)}
.tb{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:30;pointer-events:none}.tb.on{opacity:1}
.bar{height:6px;border-radius:9px;background:var(--ln);margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;background:var(--s)}
.bot{display:none}
@media(max-width:1024px){.g4{grid-template-columns:1fr 1fr}.gc{grid-template-columns:1fr}}
@media(max-width:768px){
.side{display:none}main{padding:16px 16px 96px}h1{font-size:22px;line-height:30px}.cur{font-size:22px}.g2{grid-template-columns:1fr}
.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);z-index:10;overflow-x:auto}
.bot button{flex:1;min-width:64px;border:0;background:none;padding:8px 4px;font-size:10px;font-weight:600;color:var(--mu)}.bot b{display:block;font-size:18px}.bot .on{color:var(--p)}}

let pg='produk',cart=[],disc=0,q='',cat='Semua',per='7',showHist=false,hpp={n:'',bahan:0,kemasan:0,kerja:0,over:0,qty:1,mg:40};

 $('nav1').innerHTML=n('nv');$('nav2').innerHTML=n('x');$('nav2').querySelectorAll('button').forEach((b,i)=>b.className=pg==pages[i][0]?'on':'');
 $('app').innerHTML=V[pg]();window.scrollTo(0,0)}
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const T=()=>{const mod=sum(S.fin.filter(f=>f.t=='modal'),f=>f.a),inc=sum(S.fin.filter(f=>f.t=='masuk'),f=>f.a),exp=sum(S.fin.filter(f=>f.t=='keluar'),f=>f.a),pos=sum(S.trx,t=>t.tot);return{mod,inc,exp,pos,saldo:mod+inc+pos-exp}};

const V={
dash(){const td=S.trx.filter(t=>sameDay(t.d)),om=sum(td,t=>t.tot),lb=om-sum(td,hppT),ex=sum(S.fin.filter(f=>f.t=='keluar'&&sameDay(f.d)),f=>f.a),t=T();
 return `<div class="hd"><div><h1>Selamat datang 👋</h1><p>Ringkasan ${esc(S.set.nama)} hari ini</p></div><button class="btn" onclick="go('kasir')">Buka Kasir</button></div>
 <div class="g g4" style="margin-bottom:16px">${[['Omzet hari ini',om],['Laba kotor (estimasi)',lb],['Pengeluaran hari ini',ex],['Saldo kas',t.saldo]].map(c=>`<div class="card" style="margin:0"><div class="lb">${c[0]}</div><div class="cur">${R(c[1])}</div></div>`).join('')}</div>
 <div class="g g2"><div class="card"><h3>Transaksi terbaru</h3>${S.trx.length?S.trx.slice(-5).reverse().map(trxRow).join(''):'<p>Belum ada transaksi. Mulai dari menu Kasir.</p>'}</div>
 <div class="card"><h3>Stok menipis</h3>${low().length?low().map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="chip w">Sisa ${p.s} ${esc(p.u)}</span></div>`).join(''):'<p>Semua stok aman.</p>'}</div></div>`},

 return `<div class="hd"><div><h1>Produk & Stok</h1><p>${S.prod.length} produk • ${low().length} stok menipis</p></div><div class="gap"><button class="btn sc" onclick="showHist=!showHist;render()">${showHist?'Daftar Produk':'Riwayat Stok'}</button><button class="btn" onclick="fProd()">+ Tambah Produk</button></div></div>
 ${showHist?`<div class="card"><h3>Riwayat stok</h3>${S.stk.length?S.stk.slice().reverse().slice(0,60).map(h=>`<div class="row"><div>${esc(h.n)}<small>${tgl(h.d)} • ${esc(h.c)}</small></div><b class="${h.q>0?'up':'dn'}">${h.q>0?'+':''}${h.q}</b></div>`).join(''):'<p>Belum ada pergerakan stok.</p>'}</div>`:
 `<input placeholder="Cari produk..." value="${esc(q)}" oninput="q=this.value;render();this.focus()" style="margin-bottom:12px"><div>${cats.map(c=>`<button class="ft ${cat==c?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
 <div class="card">${L.map(p=>`<div class="row"><div><b>${esc(p.n)}</b><small>${esc(p.k)} • Beli ${num(p.b)} • Jual ${num(p.j)}</small></div><div class="r"><span class="chip ${p.s<=p.m?'w':''}">${p.s} ${esc(p.u)}</span><div class="gap" style="margin-top:6px;justify-content:flex-end"><button class="btn sc sm" onclick="fStok(${p.id})">Stok</button><button class="btn sc sm" onclick="fProd(${p.id})">Edit</button><button class="btn sc sm dn" onclick="delProd(${p.id})">Hapus</button></div></div></div>`).join('')||(S.prod.length?'<p>Produk tidak ditemukan.</p>':'<p>Belum ada produk. Klik "+ Tambah Produk" untuk mulai.</p>')}</div>`}`},
kasir(){const L=S.prod.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())),sub=sum(cart,c=>c.j*c.q),tot=Math.max(0,sub-disc);
 return `<div class="hd"><div><h1>Kasir</h1><p>Pilih produk untuk masuk keranjang</p></div></div><div class="g gc"><div><input placeholder="Cari produk..." value="${esc(q)}" oninput="q=this.value;render();this.focus()" style="margin-bottom:12px"><div class="pg">${L.map(p=>`<button class="tile ${p.s<1?'x':''}" onclick="add(${p.id})"><b>${esc(p.n)}</b><div class="up" style="font-weight:600">Rp ${num(p.j)}</div><small style="color:var(--mu)">Stok ${p.s} ${esc(p.u)}</small></button>`).join('')||`<p>${S.prod.length?'Produk tidak ditemukan.':'Belum ada produk. Tambahkan dulu di menu Produk & Stok.'}</p>`}</div></div>
 <div class="card"><h3>Keranjang</h3>${cart.length?cart.map((c,i)=>`<div class="row"><div>${esc(c.n)}<small>Rp ${num(c.j)}</small></div><div class="gap"><button class="btn sc sm" onclick="qty(${i},-1)">−</button><b>${c.q}</b><button class="btn sc sm" onclick="qty(${i},1)">+</button></div></div>`).join(''):'<p>Keranjang kosong.</p>'}
 <label style="margin-top:12px">Diskon (Rp)<input type="number" min="0" value="${disc||''}" onchange="disc=+this.value||0;render()"></label>
 <label>Metode bayar<select id="mt">${list(S.set.bayar).map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
 <div class="lb">Total</div><div class="cur" style="margin-bottom:14px">${R(tot)}</div><button class="btn" style="width:100%;min-height:48px" onclick="bayar()">Bayar & Simpan</button></div></div>`},
uang(){const t=T(),rows=[...S.fin.map(f=>({...f,src:'f'})),...S.trx.map(x=>({id:x.id,t:'kasir',n:'Penjualan #'+x.id,a:x.tot,d:x.d,src:'t'}))].sort((a,b)=>b.d-a.d);
 const lab={modal:'Modal',masuk:'Pemasukan',keluar:'Pengeluaran',kasir:'Dari kasir'};
 return `<div class="hd"><div><h1>Keuangan</h1><p>Penjualan kasir otomatis masuk, tidak perlu dicatat lagi</p></div><button class="btn" onclick="fFin()">+ Catat Keuangan</button></div>
 <div class="g g4" style="margin-bottom:16px">${[['Saldo kas',t.saldo],['Modal',t.mod],['Pemasukan (kasir + lain)',t.inc+t.pos],['Pengeluaran',t.exp]].map(c=>`<div class="card" style="margin:0"><div class="lb">${c[0]}</div><div class="cur">${R(c[1])}</div></div>`).join('')}</div>
 <div class="card"><h3>Arus kas</h3>${rows.map(r=>`<div class="row"><div>${esc(r.n)}<small>${tgl(r.d)} • ${lab[r.t]}</small></div><div class="gap"><b class="${r.t=='keluar'?'dn':'up'}">${r.t=='keluar'?'-':'+'}${num(r.a)}</b>${r.src=='f'?`<button class="btn sc sm" onclick="delFin(${r.id})">✕</button>`:`<button class="btn sc sm" onclick="detail(${r.id})">Detail</button>`}</div></div>`).join('')}</div>`},
hpp(){const h=hpp,tot=h.bahan+h.kemasan+h.kerja+h.over,u=tot/(h.qty||1),hj=h.mg>=100?0:u/(1-h.mg/100);
 const f=(k,l)=>`<label>${l}<input type="number" min="0" value="${h[k]||''}" oninput="hpp.${k}=+this.value||0;upd()"></label>`;
 return `<div class="hd"><div><h1>HPP & Harga Jual</h1><p>Hitung modal per unit dan simulasikan harga</p></div></div><div class="g g2"><div class="card"><h3>Komponen biaya (per batch)</h3><label>Nama produk<input value="${esc(h.n)}" oninput="hpp.n=this.value"></label>${f('bahan','Biaya bahan / harga perolehan (Rp)')}${f('kemasan','Kemasan (Rp)')}${f('kerja','Tenaga kerja (Rp)')}${f('over','Biaya produksi lain (Rp)')}${f('qty','Jumlah unit yang dihasilkan')}${f('mg','Target margin (%)')}</div>
 <div class="card" id="hr"><h3>Hasil</h3>${hppRes(tot,u,hj)}</div></div>`},
lap(){const since=per=='all'?0:per=='1'?new Date().setHours(0,0,0,0):Date.now()-per*864e5,X=S.trx.filter(t=>t.d>=since),F=S.fin.filter(f=>f.t=='keluar'&&f.d>=since),om=sum(X,t=>t.tot),hp=sum(X,hppT),ex=sum(F,f=>f.a),top={};
 X.forEach(t=>t.it.forEach(i=>{top[i.n]=(top[i.n]||0)+i.q}));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=tp[0]?tp[0][1]:1;
 return `<div class="hd"><div><h1>Laporan</h1><p>${X.length} transaksi pada periode ini</p></div><select style="width:auto" onchange="per=this.value;render()">${[['1','Hari ini'],['7','7 hari'],['30','30 hari'],['all','Semua']].map(o=>`<option value="${o[0]}" ${per==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="g g4" style="margin-bottom:16px">${[['Total penjualan',om],['HPP barang terjual',hp],['Laba kotor',om-hp],['Estimasi laba rugi',om-hp-ex]].map(c=>`<div class="card" style="margin:0"><div class="lb">${c[0]}</div><div class="cur ${c[1]<0?'dn':''}">${R(c[1])}</div></div>`).join('')}</div>
 <div class="g g2"><div class="card"><h3>Produk terlaris</h3>${tp.map(p=>`<div style="margin-bottom:12px"><div class="row" style="padding:0;min-height:0;border:0"><span>${esc(p[0])}</span><b>${p[1]} terjual</b></div><div class="bar"><i style="width:${p[1]/mx*100}%"></i></div></div>`).join('')||'<p>Belum ada data penjualan.</p>'}</div>
 <div class="card"><h3>Ringkasan arus kas</h3><div class="row"><span>Pemasukan kasir</span><b class="up">${num(om)}</b></div><div class="row"><span>Pengeluaran</span><b class="dn">${num(ex)}</b></div><div class="row"><span>Arus kas bersih</span><b>${num(om-ex)}</b></div></div></div>`},
set(){const s=S.set;return `<div class="hd"><div><h1>Pengaturan</h1><p>Profil usaha dan data prototipe</p></div></div><div class="g g2"><div class="card"><h3>Profil usaha</h3><label>Nama usaha<input id="s1" value="${esc(s.nama)}"></label><label>Kategori bisnis<input id="s2" value="${esc(s.kat)}"></label><label>Metode pembayaran (pisah koma)<input id="s3" value="${esc(s.bayar)}"></label><label>Satuan produk (pisah koma)<input id="s4" value="${esc(s.satuan)}"></label><label>Batas stok menipis bawaan<input id="s5" type="number" value="${s.minDef}"></label><button class="btn" onclick="saveSet()">Simpan Pengaturan</button></div>
 <div class="card"><h3>Data & pencadangan</h3><p style="margin-bottom:14px">Data tersimpan di browser ini. Cadangkan secara berkala.</p><div class="gap"><button class="btn" onclick="exp()">Unduh Cadangan</button><label class="btn sc" style="margin:0;cursor:pointer">Pulihkan<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn dg" onclick="if(confirm('Hapus semua data (produk, transaksi, keuangan, stok) dan mulai dari kosong? Tindakan ini tidak bisa dibatalkan.')){S=fresh();save();render()}">Reset Data</button><button class="btn sc" onclick="keluar()">Keluar</button></div></div></div>`}};
const trxRow=t=>`<div class="row"><div>#${t.id} • ${t.it.map(i=>i.q+'x '+esc(i.n)).join(', ')}<small>${tgl(t.d)} • ${esc(t.m)}</small></div><div class="gap"><b>${num(t.tot)}</b><button class="btn sc sm" onclick="detail(${t.id})">Detail</button></div></div>`;
function hppRes(tot,u,hj){return `<div class="row"><span>Total biaya batch</span><b>Rp ${num(tot)}</b></div><div class="row"><span>HPP per unit</span><b>Rp ${num(u)}</b></div><div class="lb" style="margin-top:14px">Harga jual rekomendasi</div><div class="cur up">${R(Math.ceil(hj/100)*100)}</div><p style="color:var(--mu);margin:6px 0 14px">Laba per unit ± Rp ${num(Math.ceil(hj/100)*100-u)}</p>
 <label>Terapkan ke produk<select id="hp"><option value="">— pilih produk —</option>${S.prod.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></label><button class="btn" onclick="applyHpp(${u},${Math.ceil(hj/100)*100})">Terapkan Harga Beli & Jual</button>`}

$('mo').onclick=e=>{if(e.target.id=='mo')C()};
function fProd(id){const p=S.prod.find(x=>x.id==id)||{n:'',k:'',u:list(S.set.satuan)[0]||'pcs',b:'',j:'',s:0,m:S.set.minDef};
 M(`<h3>${id?'Edit':'Tambah'} Produk</h3><label>Nama produk<input id="a1" value="${esc(p.n)}"></label><label>Kategori<input id="a2" value="${esc(p.k)}" list="dl"></label><datalist id="dl">${[...new Set(S.prod.map(x=>x.k))].map(k=>`<option>${esc(k)}`).join('')}</datalist><label>Satuan<select id="a3">${list(S.set.satuan).map(u=>`<option ${u==p.u?'selected':''}>${esc(u)}</option>`).join('')}</select></label><div class="g g2" style="gap:10px"><label>Harga beli<input id="a4" type="number" min="0" value="${p.b}"></label><label>Harga jual<input id="a5" type="number" min="0" value="${p.j}"></label><label>${id?'Stok saat ini':'Stok awal'}<input id="a6" type="number" min="0" value="${p.s}" ${id?'disabled':''}></label><label>Batas stok menipis<input id="a7" type="number" min="0" value="${p.m}"></label></div><div class="gap"><button class="btn" onclick="saveProd(${id||0})">Simpan</button><button class="btn sc" onclick="C()">Batal</button></div>`)}

 if(id)Object.assign(S.prod.find(x=>x.id==id),d);else{const s=+$('a6').value||0,p={id:++S.seq,s,...d};S.prod.push(p);if(s)S.stk.push({n,q:s,c:'Stok awal',d:Date.now()})}
 save();C();render();toast('Produk disimpan')}

/* Struktur Firestore (satu set data per akun, {uid} = id akun yang login):
   usaha/{uid}                -> { set: {...pengaturan}, seq }
   usaha/{uid}/produk/{id}    -> data produk
   usaha/{uid}/transaksi/{id} -> data transaksi
   usaha/{uid}/keuangan/{id}  -> catatan keuangan
   usaha/{uid}/stok/{id}      -> riwayat stok                       */
const COLS = { prod: 'produk', trx: 'transaksi', fin: 'keuangan', stk: 'stok' };

function makeSync(fs, db) {
  const { doc, collection, getDoc, getDocs, writeBatch } = fs;
  const jstr = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v)
    ? Object.fromEntries(Object.entries(v).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : v);
  const idOf = (k, x) => String(k === 'stk' ? x._id : x.id);
  let base = null;
  const last = { root: null };
  const api = { onError: null };

  api.load = async uid => {
    base = ['usaha', uid]; Object.keys(last).forEach(k => delete last[k]); last.root = null;
    const rs = await getDoc(doc(db, ...base));
    if (!rs.exists()) return null;
    const meta = rs.data(), S = { set: meta.set, seq: meta.seq, prod: [], trx: [], fin: [], stk: [] };
    await Promise.all(Object.keys(COLS).map(async k => {
      const snap = await getDocs(collection(db, ...base, COLS[k]));
      const arr = snap.docs.map(d => d.data());
      if (k === 'stk') arr.sort((a, b) => a._id < b._id ? -1 : a._id > b._id ? 1 : 0);
      else arr.sort((a, b) => a.id - b.id);
      S[k] = arr;
      last[k] = new Map(arr.map(x => [idOf(k, x), jstr(x)]));
    }));
    last.root = jstr({ set: S.set, seq: S.seq });
    return S;
  };

  api.save = S => {
    if (!base) return;
    // riwayat stok tidak punya id: beri id berurutan supaya urutan tetap terjaga
    const stamp = String(Date.now()).padStart(13, '0');
    (S.stk || []).forEach((x, i) => { if (!x._id) x._id = stamp + String(i).padStart(5, '0'); });

    const ops = [], undo = [];
    for (const k in COLS) {
      const prev = last[k] || (last[k] = new Map()), cur = new Map();
      (S[k] || []).forEach(x => cur.set(idOf(k, x), x));
      for (const [id, x] of cur) {
        const s = jstr(x);
        if (prev.get(id) !== s) { ops.push({ del: false, c: COLS[k], id, data: JSON.parse(s) }); undo.push([k, id, prev.get(id)]); prev.set(id, s); }
      }
      for (const id of [...prev.keys()]) {
        if (!cur.has(id)) { ops.push({ del: true, c: COLS[k], id }); undo.push([k, id, prev.get(id)]); prev.delete(id); }
      }
    }
    const rs = jstr({ set: S.set, seq: S.seq });
    if (rs !== last.root) { ops.push({ root: true, data: JSON.parse(rs) }); undo.push(['root', null, last.root]); last.root = rs; }
    if (!ops.length) return;

    // dokumen induk ditulis paling akhir; commit dipanggil berurutan tanpa menunggu server (aman saat offline)
    const ps = [];
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(o => {
        const ref = o.root ? doc(db, ...base) : doc(db, ...base, o.c, o.id);
        o.del ? b.delete(ref) : b.set(ref, o.data);
      });
      ps.push(b.commit());
    }
    Promise.all(ps).catch(e => {
      console.error(e);
      // kembalikan baseline supaya perubahan dikirim ulang pada penyimpanan berikutnya
      undo.reverse().forEach(([k, id, s]) => {
        if (k === 'root') last.root = s;
        else if (s === undefined) (last[k] || new Map()).delete(id);
        else (last[k] || (last[k] = new Map())).set(id, s);
      });
      api.onError && api.onError('Gagal menyimpan ke Firestore, cek koneksi / aturan Firestore');
    });
  };
  return api;
}

try {
  const { initializeApp, fs, au } = FB; // Firebase SDK v10.14.1 sudah ditanam di file ini (script di atas), tidak perlu internet untuk memuat SDK
  const app = initializeApp(firebaseConfig);
  let db;
  try {
    db = fs.initializeFirestore(app, {
      ignoreUndefinedProperties: true,
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
  } catch (e) {
    db = fs.initializeFirestore(app, { ignoreUndefinedProperties: true });
  }
  const auth = au.getAuth(app), api = makeSync(fs, db);
  api.onAuth = cb => au.onAuthStateChanged(auth, cb);
  api.auth = (mode, e, p) => mode === 'daftar' ? au.createUserWithEmailAndPassword(auth, e, p) : au.signInWithEmailAndPassword(auth, e, p);
  api.reset = e => au.sendPasswordResetEmail(auth, e);
  api.google = () => au.signInWithPopup(auth, new au.GoogleAuthProvider());
  api.logout = () => au.signOut(auth);
  window._fbResolve(api);
} catch (e) {
  console.error('Firebase gagal dimuat', e);
  window._fbResolve(null);
}
